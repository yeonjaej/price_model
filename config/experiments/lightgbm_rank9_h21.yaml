# LightGBM on the 9-feature RANK anomaly panel (the linear headline's family).
# Companion to extended_kaggle_v3_curated_h21 (14-feature zscore): lets the
# headline pick each tree's BETTER panel rather than assuming the engineered
# panel is the trees' best. The spectrum comparison found LightGBM scored
# +0.0525 here vs +0.0403 on the 14-feature panel (untuned); this config
# re-tests that under held-out Optuna.
#   python scripts/optuna_sweep.py --experiment lightgbm_rank9_h21 \
#       --n-trials <N> --n-folds 4 --embargo-days 22 --max-date 2024-12-31 --write-tuned

experiment_id: lightgbm_rank9_h21
data: {universe: sp500_pit, start: 2017-01-01, pit_filter: true}
features:
  - momentum_12_1
  - momentum_756
  - return_1d
  - vol_ewm_20
  - idio_vol_20
  - max_return_21d
  - distance_52w_high
  - log_dollar_volume
  - beta_60
normalize_kind: rank
target_horizon: 21
walk_forward:  # regime-confined (this branch): single refit on bull regime, test 2025+
  refit_freq_days: 9999
  embargo_days: 33          # calendar; covers the 21 trading-day (~31 cal) horizon
  min_train_days: 504       # ignored when first_refit is set
  train_start: 2022-10-10   # all panels train on rows >= regime start, identically
  first_refit: 2025-01-02   # single refit -> train [2022-10-10, 2024-11-30], test 2025+
models:
  - {id: zero_v1_rank9_lgbm_baseline_h21, class: ZeroPredictor, params: {}}
  - id: lightgbm_rank9_h21
    class: LightGBMModel
    params:
      learning_rate: 0.05
      num_leaves: 31
      min_data_in_leaf: 100
      feature_fraction: 0.9
      bagging_fraction: 0.9
      bagging_freq: 5
      n_estimators: 500
      seeds: [42, 2024, 12345]
