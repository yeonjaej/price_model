# Direct momentum-factor baselines on the PIT-corrected universe.
#
# Diagnostic basis
# ----------------
# Initial hypothesis (now partially falsified by the first three rows):
# ARIMA(1,0,1) with `trend='c'` at annual refit produces a forecast
# dominated by its per-ticker constant term, which is the MLE of
# `mean(log_return)` over the training window. The conjecture was that
# this would be cross-sectionally equivalent to ranking on a long-window
# trailing momentum factor like `momentum_504`, making "ARIMA vs LightGBM"
# effectively "naive momentum vs ML."
#
# First-round result (mom_378 / mom_504 / mom_12_1 direct factors)
# ----------------------------------------------------------------
# Full-sample (1507 dates, post-feature-warmup):
#
#   mom_12_1_factor   IC = +0.0123 (t = +1.97)
#   mom_378_factor    IC = +0.0099 (t = +1.72)
#   mom_504_factor    IC = +0.0040 (t = +0.68)
#
# vs ARIMA full-sample: IC = +0.0162 (t = +4.42)
# vs GBM   full-sample: IC = +0.0144 (t = +3.05)
#
# Two findings:
#
# (1) Among fixed-endpoint trailing-momentum factors, IC DECREASES with
#     lookback length: 12-month > 18-month > 24-month. Consistent with
#     the Jegadeesh-Titman 12-month being the empirical sweet spot; longer
#     lookbacks add stale data that dilutes the signal.
#
# (2) NONE of the direct momentum factors reproduces ARIMA's IC. The
#     closest-window proxy (mom_504, 24-month, the supposed
#     "ARIMA-drift equivalent") posts only IC +0.0040 — a quarter of
#     ARIMA's. The simple "ARIMA = trailing momentum factor"
#     identification is falsified.
#
# The remaining structural difference: ARIMA and GBM both estimate
# per-ticker drift via MLE on the FULL training window (~600 to ~2200
# days under annual refit), using every observation with statistically-
# appropriate weighting. The direct factors use only two endpoints
# (log P_T, log P_{T-W}) for a fixed W. On a 2000-day window, MLE has
# orders of magnitude more information about the per-ticker drift than
# the endpoint difference.
#
# This row (mom_756) tests the implication: if the gap is about
# estimator efficiency (MLE vs endpoint difference) rather than window
# length, longer fixed-endpoint windows should make IC WORSE, not
# better. Predicted: mom_756_factor IC ≤ +0.0040, possibly negative.
# If the result lands above mom_504's +0.0040, the framing complicates.
# Either outcome is informative.
#
# Wall-clock: ~30 seconds. No model fit happens; the predict step
# just returns the feature value. The walk-forward harness still
# iterates through refits to keep the prediction-date grid identical
# to the other models, but each refit is trivial.

experiment_id: momentum_factor_pit_v1

data:
  universe: sp500_pit
  start: 2017-01-01
  pit_filter: true

features:
  - momentum_12_1                 # Jegadeesh-Titman canonical 12-1 month
  - momentum_378                  # 18-month
  - momentum_504                  # 24-month
  - momentum_756                  # 36-month — extends the trailing-window decay curve

normalize_kind: zscore
target_horizon: 5

walk_forward:
  refit_freq_days: 252            # annual refit to match ARIMA's cadence
  embargo_days: 6
  min_train_days: 504

models:
  - id: mom_378_factor
    class: MomentumFactor
    features:
      - momentum_378
    params:
      feature_name: momentum_378

  - id: mom_504_factor
    class: MomentumFactor
    features:
      - momentum_504
    params:
      feature_name: momentum_504

  - id: mom_12_1_factor
    class: MomentumFactor
    features:
      - momentum_12_1
    params:
      feature_name: momentum_12_1

  - id: mom_756_factor
    class: MomentumFactor
    features:
      - momentum_756
    params:
      feature_name: momentum_756
