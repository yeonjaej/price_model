# 1-feature LightGBM with num_leaves=4 — capacity-reduction test.
#
# Diagnostic purpose
# ------------------
# Companion to lightgbm_1feat_monotone_pit.yaml. The monotone-constraint
# variant tests whether forcing non-decreasing predictions recovers the
# signal. This variant tests an alternative fix: just reduce the tree's
# split capacity until it matches the underlying bucket structure of the
# feature-to-target relationship.
#
# The bucket plot of momentum_12_1 vs 5-day forward excess return shows
# approximately three regions on this universe:
#
#   Bottom 20% (deciles 0-1):  mean realized ≈ -0.0006
#   Middle 70% (deciles 2-8):  mean realized ≈ +0.0001 (noise)
#   Top 10%   (decile 9):     mean realized ≈ +0.0010
#
# A 64-leaf tree carves the feature axis into 64 bins, ~58 of which fall
# in the noise-dominated middle 70%. With per-bin sampling noise of
# ~3.5 bp and per-bin signal of ~1 bp in the middle, the tree's
# predictions are noise-dominated there. Reducing num_leaves to 4 forces
# the tree to make broader splits, naturally aligning with the three-
# region structure above.
#
# Expected result
# ---------------
# - num_leaves=4 should produce predictions roughly equivalent to a
#   step function with 4 levels.
# - If the four steps correctly capture the bottom / middle / top
#   structure, the predictions will rank-correlate with mom_12_1 and
#   recover much of the raw signal.
# - Predicted post-October-2022 IC: ≈ +0.018 to +0.022 (slightly less
#   than the monotone-constraint variant because the tree can still
#   place a "wrong" split if training noise misleads it, but the small
#   leaf count limits how much damage that can do).
#
# If both this variant and the monotone-constraint variant recover the
# signal, the diagnosis is doubly confirmed: the original 22-feature
# config's `num_leaves=64` is the wrong capacity for low-feature-count
# inputs. The fix is to scale `num_leaves` with feature count, or to
# use monotone constraints for features with known signed effects.

experiment_id: lightgbm_1feat_small_pit

data:
  universe: sp500_pit
  start: 2017-01-01
  pit_filter: true

features:
  - momentum_12_1

normalize_kind: zscore
target_horizon: 5

walk_forward:
  refit_freq_days: 21
  embargo_days: 6
  min_train_days: 504

models:
  - id: zero_v1_1feat_small
    class: ZeroPredictor
    params: {}

  - id: lightgbm_1feat_small_pit_v1
    class: LightGBMModel
    params:
      learning_rate: 0.02
      num_leaves: 4              # reduced from 64 — capacity matched to feature count
      min_data_in_leaf: 200
      feature_fraction: 0.7
      bagging_fraction: 0.7
      bagging_freq: 5
      lambda_l1: 0.1
      lambda_l2: 5.0
      n_estimators: 1000
      val_fraction: 0.1
      early_stopping_rounds: 100
      seeds: [42, 2024, 12345]
