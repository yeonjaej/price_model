# Annual-refit 23-feature LightGBM with EMPIRICALLY-determined monotone
# constraints.
#
# Diagnostic basis
# ----------------
# The per-feature univariate cross-sectional IC table on this PIT-corrected
# panel post-October-2022 shows that three textbook-signed features have
# opposite empirical signs on this universe / regime:
#
#                              textbook         empirical
#   max_return_21d              -1 (MAX)        +1 (IC = +0.0218, t = +3.48)
#   momentum_60                 +1               -1 (IC = -0.0076)
#   momentum_60_rank            +1               -1 (IC = -0.0076)
#   distance_52w_high           +1 (anchoring)   -1 (IC = -0.0031)
#
# The original monotone-constrained experiment used textbook signs and
# produced no improvement over the unconstrained model. This experiment
# uses empirical signs from the same data the model trains on. The
# rationale: a wrong-sign monotone constraint forces the tree to learn
# the opposite of the data's actual direction on that feature; an
# empirically-correct constraint forces the tree to respect a
# direction it would otherwise overfit non-monotonically (as we saw on
# the 1-feature case, where the constraint recovered ~75% of the
# destroyed signal).
#
# Constraint assignments
# ----------------------
# Per the empirical post-2022 univariate IC table:
#
#   +1 (positive cross-sectional IC, |t| ≥ 2):
#       vol_ewm_20, vol_20, vol_20_rank, vol_20_cs_min_dist,
#       momentum_12_1, max_return_21d, parkinson_vol_20,
#       log_dollar_volume, range_ratio, momentum_378, momentum_504,
#       body_ratio, abnormal_volume
#
#   -1 (negative cross-sectional IC, |t| ≥ 2 OR clear opposite sign):
#       return_1d, mom60_minus_dist_ma200, return_5d, rsi_14,
#       momentum_60, momentum_60_rank, distance_52w_high
#
#    0 (no constraint, |t| < 1 — let the tree decide):
#       distance_ma_200, distance_ma_200_rank, idio_vol_20
#
# Hypothesis
# ----------
# If wrong-sign constraints were the reason the original monotone
# experiment failed (i.e., the constraint mechanism works but I assigned
# the wrong signs), this configuration should produce a meaningful lift
# in gross IC and net Sharpe over both the unconstrained baseline and
# the textbook-signed monotone variant.

experiment_id: extended_kaggle_v2_ohlcv_annual_monotone_empirical

data:
  universe: sp500_pit
  start: 2017-01-01
  pit_filter: true

features:
  - return_5d
  - momentum_60
  - vol_20
  - rsi_14
  - distance_ma_200
  - idio_vol_20
  - momentum_60_rank
  - vol_20_rank
  - distance_ma_200_rank
  - vol_ewm_20
  - vol_20_cs_min_dist
  - mom60_minus_dist_ma200
  - momentum_12_1
  - distance_52w_high
  - return_1d
  - range_ratio
  - body_ratio
  - parkinson_vol_20
  - log_dollar_volume
  - abnormal_volume
  - max_return_21d
  - momentum_378
  - momentum_504

normalize_kind: zscore
target_horizon: 5

walk_forward:
  refit_freq_days: 252
  embargo_days: 6
  min_train_days: 504

models:
  - id: zero_v1_annual_emp
    class: ZeroPredictor
    params: {}

  - id: lightgbm_kaggle_v2_ohlcv_annual_monotone_empirical
    class: LightGBMModel
    params:
      learning_rate: 0.02
      num_leaves: 64
      min_data_in_leaf: 200
      feature_fraction: 0.7
      bagging_fraction: 0.7
      bagging_freq: 5
      lambda_l1: 0.1
      lambda_l2: 5.0
      n_estimators: 1000
      val_fraction: 0.1
      early_stopping_rounds: 100
      seeds: [42, 2024, 12345]
      # Empirically-determined monotone constraints, one per feature in the
      # order listed above. Derived from per-feature post-Oct-2022
      # univariate IC measurement on this exact PIT panel.
      monotone_constraints: [
        -1,  # return_5d                   empirical IC = -0.0105 (textbook +)
        -1,  # momentum_60                 empirical IC = -0.0076 (textbook +)
         1,  # vol_20                      empirical IC = +0.0252 (was 0)
        -1,  # rsi_14                      empirical IC = -0.0101
         0,  # distance_ma_200             empirical IC = +0.0032 (weak)
         0,  # idio_vol_20                 empirical IC = +0.0060 (weak)
        -1,  # momentum_60_rank            empirical IC = -0.0076 (textbook +)
         1,  # vol_20_rank                 empirical IC = +0.0252 (was 0)
         0,  # distance_ma_200_rank        empirical IC = +0.0032 (weak)
         1,  # vol_ewm_20                  empirical IC = +0.0259 (was 0)
         1,  # vol_20_cs_min_dist          empirical IC = +0.0252 (was 0)
        -1,  # mom60_minus_dist_ma200      empirical IC = -0.0110
         1,  # momentum_12_1               empirical IC = +0.0220
        -1,  # distance_52w_high           empirical IC = -0.0031 (textbook +)
        -1,  # return_1d                   empirical IC = -0.0121
         1,  # range_ratio                 empirical IC = +0.0159 (was 0)
         1,  # body_ratio                  empirical IC = +0.0122 (was 0)
         1,  # parkinson_vol_20            empirical IC = +0.0195 (was 0)
         1,  # log_dollar_volume           empirical IC = +0.0184 (was 0)
         1,  # abnormal_volume             empirical IC = +0.0090 (was 0)
         1,  # max_return_21d              empirical IC = +0.0218 (textbook -)
         1,  # momentum_378                empirical IC = +0.0155
         1,  # momentum_504                empirical IC = +0.0148
      ]
